name: Scheduled Playwright Tests

# Each environment runs at its own time on weekdays. They share the ID-porten/MinID
# test environment, which rate-limits logins, so runs should not overlap.
# A run takes about 10 minutes, and GitHub often starts scheduled jobs 15 minutes late.
on:
  schedule:
    - cron: "0 3 * * 1-5" # AT22
    - cron: "0 4 * * 1-5" # AT23
    - cron: "0 5 * * 1-5" # TT02
  workflow_dispatch: # Manual run tests all environments

jobs:
  at22:
    name: Scheduled Playwright Tests - AT22 - e2e-tests
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 1-5'
    uses: ./.github/workflows/template-playwright.yml
    secrets: inherit
    with:
      environment: AT22
      project: e2e-tests

  at23:
    name: Scheduled Playwright Tests - AT23 - e2e-tests
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * 1-5'
    uses: ./.github/workflows/template-playwright.yml
    secrets: inherit
    with:
      environment: AT23
      project: e2e-tests

  tt02:
    name: Scheduled Playwright Tests - TT02 - e2e-tests
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 5 * * 1-5'
    uses: ./.github/workflows/template-playwright.yml
    secrets: inherit
    with:
      environment: TT02
      project: e2e-tests
