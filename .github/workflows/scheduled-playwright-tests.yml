name: Scheduled Playwright Tests

# Each environment runs at its own time on weekdays. They share the ID-porten/MinID
# test environment, which rate-limits logins, so runs should not overlap.
# Times are UTC: 06:30, 07:00 and 07:30 Norwegian winter time (one hour later in summer),
# so the runs avoid the maintenance window around 04:00.
on:
  schedule:
    - cron: "30 5 * * 1-5" # AT22
    - cron: "0 6 * * 1-5" # AT23
    - cron: "30 6 * * 1-5" # TT02
  workflow_dispatch: # Manual run tests all environments

jobs:
  at22:
    name: Scheduled Playwright Tests - AT22 - e2e-tests
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 5 * * 1-5'
    uses: ./.github/workflows/template-playwright.yml
    secrets: inherit
    with:
      environment: AT22
      project: e2e-tests

  at23:
    name: Scheduled Playwright Tests - AT23 - e2e-tests
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1-5'
    uses: ./.github/workflows/template-playwright.yml
    secrets: inherit
    with:
      environment: AT23
      project: e2e-tests

  tt02:
    name: Scheduled Playwright Tests - TT02 - e2e-tests
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * 1-5'
    uses: ./.github/workflows/template-playwright.yml
    secrets: inherit
    with:
      environment: TT02
      project: e2e-tests
