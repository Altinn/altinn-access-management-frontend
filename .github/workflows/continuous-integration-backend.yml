name: 'Continuous Integration: Backend'

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .repo.jsonc
      - Altinn.AccessManagement.UI.slnx
      - src/apps/Altinn.AccessManagement.UI/**
      - '!src/apps/Altinn.AccessManagement.UI/frontend/**'

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .repo.jsonc
      - Altinn.AccessManagement.UI.slnx
      - src/apps/Altinn.AccessManagement.UI/**
      - '!src/apps/Altinn.AccessManagement.UI/frontend/**'

jobs:
  ci:
    name: 'Continous Integration'
    secrets: inherit
    uses: './.github/workflows/template-build-and-test-backend.yml'
