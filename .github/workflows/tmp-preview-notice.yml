# TEMPORARY: preview of the report notice. Remove before merge.
name: tmp-preview-notice
on:
  push:
    branches: [test/uu-report-url-in-log]
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: UU reporter (simulated)
        run: |
          echo "UU: 79 skanninger, 6 regler med brudd (2 kritiske), 1 tekniske UU-feil"
          echo "::warning title=UU-funn::79 skanninger, 6 regler med brudd (2 kritiske), 1 tekniske UU-feil."
          printf '%s\n' '### UU' '79 skanninger, 6 regler med brudd (2 kritiske), 1 tekniske UU-feil.' '' '| Alvorlighet | Regel | Skanninger |' '|---|---|---:|' '| Kritisk | Eksempelregel `example-rule` | 3 |' >> "$GITHUB_STEP_SUMMARY"
      - name: Show report URL
        env:
          REPORT_URL: https://playwrightreporting.z1.web.core.windows.net/41600921382-AT23/AT23/
        run: |
          NOTICE="Playwright-rapport: $REPORT_URL"
          NOTICE="$NOTICE%0APlaywright Universell Utforming-rapport: ${REPORT_URL}uu/index.html"
          echo "::notice title=Rapporter AT23::$NOTICE"
