# TEMPORARY: preview of the job summary. Remove before merge.
name: tmp-preview-summary
on:
  push:
    branches: [test/uu-report-url-in-log]
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Job summary (generated by the real reporters from example data)
        run: |
          echo "::warning title=UU-funn::23 skanninger, 6 regler med brudd (2 kritiske), 1 tekniske UU-feil."
          cat .github/tmp-preview/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Show report URL
        env:
          REPORT_URL: https://playwrightreporting.z1.web.core.windows.net/41600921382-AT23/AT23/
        run: |
          echo "::notice title=Rapporter AT23::Playwright-rapport: $REPORT_URL%0APlaywright Universell Utforming-rapport: ${REPORT_URL}uu/index.html"
