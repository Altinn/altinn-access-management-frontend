# TEMPORARY: preview of the report notice. Remove before merge.
name: tmp-preview-notice
on:
  push:
    branches: [test/uu-report-url-in-log]
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Show report URL
        env:
          REPORT_URL: https://playwrightreporting.z1.web.core.windows.net/41600921382-AT23/AT23/
        run: |
          echo "Playwright report: $REPORT_URL"
          echo "[Playwright report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          NOTICE="Playwright: $REPORT_URL"
          echo "UU report: ${REPORT_URL}uu/index.html"
          NOTICE="$NOTICE – UU: ${REPORT_URL}uu/index.html"
          echo "::notice title=Rapporter AT23::$NOTICE"
