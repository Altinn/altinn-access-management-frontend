name: template-playwright.yml

on:
  workflow_dispatch:
    inputs:
      accessibility:
        description: Enable accessibility scans in existing E2E tests
        type: boolean
        default: false
      project:
        description: Playwright project
        type: string
        required: true
      environment:
        type: choice
        required: true
        options:
          - AT22
          - AT23
          - TT02
        description: Environment

  workflow_call:
    inputs:
      accessibility:
        description: Enable accessibility scans in existing E2E tests
        type: boolean
        default: false
      project:
        description: Playwright project
        type: string
        required: true
      environment:
        type: string
        required: true
        description: Environment

jobs:
  e2e-tests:
    name: Playwright end to end tests
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        run: yarn --immutable
      - name: Install Chromium
        if: inputs.accessibility
        working-directory: playwright
        run: yarn exec playwright install --with-deps chromium
      - name: Running yarn tests
        working-directory: playwright
        env:
          USERNAME_TEST_API: ${{ secrets.USERNAME_TEST_API }}
          PASSWORD_TEST_API: ${{ secrets.PASSWORD_TEST_API }}
          MASKINPORTEN_CLIENT_ID: ${{ secrets.MASKINPORTEN_CLIENT_ID }}
          MASKINPORTEN_JWK: ${{ secrets.MASKINPORTEN_JWK }}
          MASKINPORTEN_BEHALF_OF_CLIENT_ID: ${{ secrets.MASKINPORTEN_BEHALF_OF_CLIENT_ID }}
          MASKINPORTEN_BEHALF_OF_JWK: ${{ secrets.MASKINPORTEN_BEHALF_OF_JWK }}
          AT23_REGISTER_SUBSCRIPTION_KEY: ${{ secrets.AT23_REGISTER_SUBSCRIPTION_KEY }}
          TT02_REGISTER_SUBSCRIPTION_KEY: ${{ secrets.TT02_REGISTER_SUBSCRIPTION_KEY }}
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECT: ${{ inputs.project }}
          UU_SCAN: ${{ inputs.accessibility && '1' || '0' }}
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          yarn run "env:${ENVIRONMENT}" --project "${PROJECT}" --workers=4
      - name: Export UU HTML reports
        if: ${{ always() && inputs.accessibility }}
        working-directory: playwright
        env:
          REPORT_NAME: ${{ inputs.environment }}
        run: node util/exportAccessibilityReports.cjs jsonReports/jsonReport.json "playwright-report/$REPORT_NAME/uu"
      - name: Test summary
        if: always()
        working-directory: playwright
        run: node util/testSummary.cjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report-${{ inputs.environment }}
          path: playwright/playwright-report/${{ inputs.environment }}
          retention-days: 30

      - name: Azure CLI Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        if: always()
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload HTML report to Azure
        id: upload-report
        if: always()
        env:
          REPORT_NAME: ${{ inputs.environment }}
          RUN_ID: ${{ github.run_id }}
        run: |
          REPORT_ID="${RUN_ID}-${REPORT_NAME}"     # unique per job run
          ACCOUNT_NAME=playwrightreporting

          az storage blob upload-batch \
              --account-name "$ACCOUNT_NAME" \
              --destination "\$web" \
              --destination-path "$REPORT_ID/$REPORT_NAME" \
              --source "playwright/playwright-report/$REPORT_NAME" \
              --overwrite \
              --auth-mode login

          echo "REPORT_URL=https://playwrightreporting.z1.web.core.windows.net/$REPORT_ID/$REPORT_NAME/" >> "$GITHUB_ENV"
      - name: Show report URL
        if: ${{ always() && steps.upload-report.outcome == 'success' }}
        env:
          ACCESSIBILITY: ${{ inputs.accessibility }}
        run: |
          echo "Playwright report: $REPORT_URL"
          echo "[Playwright report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ACCESSIBILITY" = "true" ]; then
            echo "UU report: ${REPORT_URL}uu/"
            echo "[UU reports with screenshots and fixes](${REPORT_URL}uu/)" >> "$GITHUB_STEP_SUMMARY"
          fi
