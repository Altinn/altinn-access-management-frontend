name: 'Build GitHub Runner Image'

on:
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * 0' # Every Sunday

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Date Version
        run: echo "VERSION=$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .github
          file: Dockerfile.runner
          push: true
          tags: | 
            ghcr.io/altinn/altinn-access-management-frontend/gh-runner:${{ env.VERSION }}
            ghcr.io/altinn/altinn-access-management-frontend/gh-runner:latest
